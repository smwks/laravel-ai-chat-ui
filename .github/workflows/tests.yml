name: tests

on:
  push:
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]

    # Laravel 13 only for now: pestphp/pest ^5.0 requires symfony/process ^8.1, but
    # orchestra/testbench's Laravel-12-compatible line (^10.x) still pins
    # symfony/process ^7.2 — the two can't currently be installed together, so
    # Laravel 12 isn't testable here yet despite being an allowed version in
    # composer.json's own `illuminate/support` constraint.
    name: PHP ${{ matrix.php }} — Laravel 13.*

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
